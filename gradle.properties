# Keep the daemon warm between builds, but stop it after 15 idle minutes
org.gradle.daemon=true
org.gradle.daemon.idletimeout=900000
org.gradle.jvmargs=-Xms128m -Xmx512m -XX:+UseSerialGC -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.logging.level=quiet
gdxVersion=1.14.0
lwjgl3Version=3.4.1
