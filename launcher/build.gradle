plugins {
  id 'application'
  id 'org.openjfx.javafxplugin' version '0.1.0'
}

application {
  // Launcher instead of LauncherApp, otherwise JavaFX says "runtime components are missing"
  mainClass = 'io.github.fableops.launcher.Launcher'
  // Allow C2 JIT optimization, parallel GC, and adequate heap for JavaFX + LibGDX
  applicationDefaultJvmArgs = ['-Xms64m', '-Xmx512m', '--enable-native-access=ALL-UNNAMED']
}

javafx {
  version = '21.0.2'
  modules = ['javafx.controls', 'javafx.fxml']
}

dependencies {
  implementation project(':core')
  implementation project(':lwjgl3')
}
