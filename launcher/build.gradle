plugins {
  id "application"
  id "org.openjfx.javafxplugin" version "0.1.0"
}

// Launcher (not LauncherApp) is the entry point on purpose — see Launcher.java.
application.mainClass = 'io.github.fableops.launcher.Launcher'
eclipse.project.name = appName + '-launcher'

javafx {
  version = "21.0.2"
  modules = ["javafx.controls", "javafx.fxml"]
}

dependencies {
  implementation project(':lwjgl3')
  // Explicit: ':lwjgl3' depends on ':core' with `implementation`, which is not
  // transitive at compile time, so the launcher needs its own view of core.
  implementation project(':core')
}

run {
  jvmArgs += "--enable-native-access=ALL-UNNAMED"
}
