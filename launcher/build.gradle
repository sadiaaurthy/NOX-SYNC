plugins {
  id 'application'
  id 'org.openjfx.javafxplugin' version '0.1.0'
}

application {
  // Launcher instead of LauncherApp, otherwise JavaFX says "runtime components are missing"
  mainClass = 'io.github.fableops.launcher.Launcher'
  // Small heap and serial GC for a faster start and less RAM
  applicationDefaultJvmArgs = ['-XX:+UseSerialGC', '-XX:TieredStopAtLevel=1', '-Xms32m', '-Xmx256m',
                               '--enable-native-access=ALL-UNNAMED']
}

javafx {
  version = '21.0.2'
  modules = ['javafx.controls', 'javafx.fxml']
}

dependencies {
  implementation project(':core')
  implementation project(':lwjgl3')
}
